<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KATANBUILD | مواد بناء فاخرة</title>
    <link rel="icon" type="image/png" href="https://katanbuild.com/storage/branding/logo-dark.png" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Cairo:wght@300;600;800;900&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #030712; --gold: #ffd700; --cyan: #38bdf8;
            --glass: rgba(15,23,42,0.6); --border: rgba(255,215,0,0.25);
            --shadow: 0 0 30px rgba(255,215,0,0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9;
            min-height: 100vh; overflow-x: hidden;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        #bgCanvas { position: fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:0; opacity:0.6; }
        .watermark {
            position: fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            width:80vw; max-width:700px; pointer-events:none; z-index:0;
            opacity:0.06; filter:drop-shadow(0 0 60px var(--gold));
            animation:pulse 6s infinite alternate;
        }
        @keyframes pulse { 0%{opacity:0.06;transform:scale(0.95);} 100%{opacity:0.15;transform:scale(1.05);} }
        .header { position:sticky; top:0; z-index:100; background:rgba(3,7,18,0.85); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:12px 0; }
        .header-inner { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        .logo img { height:48px; filter:drop-shadow(0 0 20px var(--gold)); }
        .nav { display:flex; gap:24px; }
        .nav a { color:#f1f5f9; text-decoration:none; font-weight:700; transition:0.3s; position:relative; }
        .nav a::after { content:''; position:absolute; bottom:-4px; left:0; width:0; height:2px; background:var(--gold); transition:0.3s; }
        .nav a:hover::after { width:100%; }
        .nav a:hover { color:var(--gold); }
        .btn-gold { background:var(--gold); color:#000; padding:12px 32px; border-radius:12px; font-weight:800; text-decoration:none; display:inline-block; transition:0.3s; box-shadow:0 0 30px rgba(255,215,0,0.2); }
        .btn-gold:hover { box-shadow:0 0 60px rgba(255,215,0,0.4); transform:translateY(-2px); }
        .hero { padding:60px 0 80px; text-align:center; position:relative; z-index:1; }
        .hero h1 { font-family:'Orbitron'; font-size:48px; font-weight:900; text-shadow:0 0 40px rgba(255,215,0,0.3); }
        .hero h1 span { color:var(--gold); }
        .hero p { color:#94a3b8; font-size:18px; max-width:600px; margin:20px auto; }
        .products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; margin:40px 0; }
        .product-card { background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:16px; overflow:hidden; cursor:pointer; transition:0.3s; text-align:center; }
        .product-card:hover { transform:translateY(-6px); border-color:var(--gold); box-shadow:var(--shadow); }
        .product-card img { width:100%; height:180px; object-fit:cover; border-bottom:1px solid var(--border); }
        .product-card .title { padding:16px; font-weight:800; font-size:18px; }
        .product-items-popup { max-height:0; overflow:hidden; transition:0.4s ease; padding:0 16px; background:rgba(3,7,18,0.5); }
        .product-card.open .product-items-popup { max-height:300px; padding:16px; }
        .product-items-popup ul { list-style:none; display:flex; flex-wrap:wrap; gap:6px; }
        .product-items-popup li { background:rgba(255,215,0,0.1); border:1px solid var(--border); padding:4px 12px; border-radius:20px; font-size:13px; }
        .footer { padding:30px 0; border-top:1px solid var(--border); text-align:center; color:#94a3b8; }
        @media (max-width:768px) { .hero h1 { font-size:32px; } .products-grid { grid-template-columns:1fr 1fr; } }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <img src="https://i.ibb.co/ynfj9gdt/Gemini-Generated-Image-jpxoekjpxoekjpxo.png" class="watermark" />
    <header class="header">
        <div class="container header-inner">
            <a class="logo" href="/"><img src="https://katanbuild.com/storage/branding/logo-dark.png" /></a>
            <nav class="nav"><a href="/">الرئيسية</a><a href="/orders.html">طلب</a></nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <h1>مواد بناء<br /><span>تُبنى عليها الثقة.</span></h1>
            <p>لواصق سيراميك وغرانيت، طينة ديكور، عوازل وروبة بمواد ألمانية.</p>
            <a class="btn-gold" href="/orders.html">اطلب الآن</a>
        </section>
        <div class="container">
            <h2 style="font-family:'Orbitron'; font-size:28px; text-align:center; margin:20px 0;">عائلات المنتجات</h2>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </main>
    <footer class="footer">© 2026 مؤسسة قطان التجارية · Katanbuild</footer>
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Star {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 1.4 + 0.5; this.alpha = Math.random(); this.speed = Math.random() * 0.015 + 0.005; this.growing = Math.random() > 0.5; }
            update() { if(this.growing){this.alpha += this.speed; if(this.alpha >= 0.8) this.growing = false;} else {this.alpha -= this.speed; if(this.alpha <= 0.15) this.growing = true;} }
            draw() { ctx.fillStyle = `rgba(186,230,253,${this.alpha})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
        }
        for (let i=0; i<80; i++) stars.push(new Star());
        function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); stars.forEach(s=>{s.update();s.draw();}); requestAnimationFrame(animate); }
        animate();
        const PRODUCTS = [
            { cat:'لاصق ديكور', img:'https://katanbuild.com/storage/product-families/01KY79NYHN1GWEMSFAX7ZYP9DR.png', items:['كارو فيكس','كلايتور','بروسيل احمر','القرع ديكور فيكس','لازورد','فورريفر فيكس','ايفرست'] },
            { cat:'لاصق مسبح', img:'https://katanbuild.com/storage/product-families/cat-plaster.jpg', items:['آن ازرق','الباسل','عباس','اونكس','الترا غريب اكسترا','اكوا فيكس بلس','بروسيل مسابح','الترا بوند ازرق'] },
            { cat:'لاصق غرانيت', img:'https://i.ibb.co/8n73h5xG/laith.png', items:['ليث ازرق','الترا جريب','كلوبال فيكس','توب فيكس','ناولو','سلامات فكس','سبان فيكس','شربجي','نجار فيكس','الترا بوند اخضر','بروسيل اخضر'] },
            { cat:'لاصق سيراميك', img:'https://i.ibb.co/hJDtVZWQ/mockup.png', items:['سيتي فيكس','كرافت الترافيكس','لايت فيكس','بريمير فيكس','موسيك فيكس','سيرا فيكس','منستر فيكس 100','فيكسو','الترا بوند احمر','بروسيل رمادي'] },
            { cat:'لاصق خارجي', img:'https://i.ibb.co/Cs08vYMV/raed-o.png', items:['مارفيل','الترا بوند ذهبي','الترا بوند اورنج'] },
            { cat:'طينة', img:'https://i.ibb.co/wFTbGVwQ/Paper-Bag-Mockup-Solid.png', items:['طينة سولايد ميكس اسمنتية 50كغ','طينة اسمنتية سولايد ميكس 18كغ','الترا بوند طينة بلاستيكية','الترا بوند طينة اكرليكية','طينة غرانيت'] },
            { cat:'روبة', img:'https://i.ibb.co/39XZ6n5k/graft.png', items:['الترا جريب','جراوت اصلاح الترا بوند'] },
            { cat:'عوازل', img:'https://i.ibb.co/m553JtKC/image.png', items:['عازل مركبين','عازل بلاستيكي','عازل حجر شفاف'] }
        ];
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = PRODUCTS.map((p,i) => `
            <div class="product-card" onclick="toggleCard(this)">
                <img src="${p.img}" alt="${p.cat}" loading="lazy" />
                <div class="title">${p.cat}</div>
                <div class="product-items-popup"><ul>${p.items.map(item => `<li>${item}</li>`).join('')}</ul></div>
            </div>
        `).join('');
        function toggleCard(el) { el.classList.toggle('open'); }
    </script>
</body>
</html>
