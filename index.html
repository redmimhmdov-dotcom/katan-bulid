    <style>
        /* ===== CORE VARIABLES ===== */
        :root {
            --bg-dark-indigo: radial-gradient(ellipse at center, #0b132b 0%, #030712 100%);
            --card-glass: rgba(15, 23, 42, 0.55);
            --accent-gold: #ffd700;
            --accent-cyan: #38bdf8;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-glow: rgba(255, 215, 0, 0.25);
            --border-indigo: rgba(56, 189, 248, 0.25);
            --shadow-glow: 0 0 40px rgba(255, 215, 0, 0.2);
            --radius-card: 20px;
            --transition-fast: 0.3s ease;
            --transition-smooth: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* ===== CUSTOM SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--accent-gold), var(--accent-cyan));
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }

        /* ===== SELECTION COLOR ===== */
        ::selection {
            background-color: var(--accent-gold);
            color: #000;
        }
        ::-moz-selection {
            background-color: var(--accent-gold);
            color: #000;
        }

        /* ===== TEXT GRADIENT UTILITY ===== */
        .text-gradient {
            background: linear-gradient(90deg, var(--accent-gold) 0%, #ffea70 50%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark-indigo);
            color: var(--text-light);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ===== BLEND LOGO ===== */
        .blend-logo {
            mix-blend-mode: screen;
            filter: brightness(1.1) contrast(1.1);
            object-fit: contain;
        }

        /* ===== WATERMARK LOGO ===== */
        .watermark-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            max-width: 800px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.10;
            animation: watermarkNeonPulse 6s infinite alternate ease-in-out;
        }

        @keyframes watermarkNeonPulse {
            0% { opacity: 0.08; filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.15)) saturate(100%); }
            100% { opacity: 0.20; filter: drop-shadow(0 0 60px rgba(255, 215, 0, 0.6)) drop-shadow(0 0 25px rgba(56, 189, 248, 0.3)) saturate(150%); }
        }

        /* ===== BACKGROUND CANVAS (STARS) ===== */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.7;
        }

        /* ===== LOADER ===== */
        .loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #030712;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-inner {
            text-align: center;
        }

        .loader-mark {
            margin-bottom: 20px;
        }

        .loader-brick {
            width: 80px;
            height: 56px;
            margin: 0 auto;
        }

        .loader-brick .b {
            fill: var(--accent-gold);
            opacity: 0.3;
            animation: brickPulse 1.2s infinite alternate;
        }

        .loader-brick .b1 { animation-delay: 0s; }
        .loader-brick .b2 { animation-delay: 0.2s; }
        .loader-brick .b3 { animation-delay: 0.4s; }

        @keyframes brickPulse {
            0% { opacity: 0.3; fill: var(--accent-gold); }
            100% { opacity: 1; fill: var(--accent-cyan); }
        }

        .loader-bar {
            display: block;
            width: 160px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 16px auto 0;
            overflow: hidden;
        }

        #loaderBar {
            display: block;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-cyan));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .loader-text {
            margin-top: 20px;
        }

        .loader-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            display: block;
        }

        .loader-sub {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
            display: block;
        }

        /* ===== SCROLL PROGRESS ===== */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-cyan));
            width: 0%;
            z-index: 1000;
            transition: width 0.1s linear;
        }

        /* ===== SKIP LINK ===== */
        .skip-link {
            position: absolute;
            top: -1000px;
            left: 20px;
            z-index: 10000;
            padding: 12px 24px;
            background: var(--accent-gold);
            color: #000;
            font-weight: 800;
            border-radius: 8px;
            font-family: 'Cairo';
        }

        .skip-link:focus {
            top: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 13, 27, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            padding: 10px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo img {
            height: 50px;
            width: auto;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.3));
        }

        .menu {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .menu a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: var(--transition-fast);
            position: relative;
            padding: 4px 0;
        }

        .menu a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: var(--transition-fast);
        }

        .menu a:hover::after, .menu a.active::after {
            width: 100%;
        }

        .menu a:hover, .menu a.active {
            color: var(--accent-gold);
        }

        .nav-cta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-toggle {
            display: inline-block;
            cursor: pointer;
            user-select: none;
        }

        .lang-toggle-inner {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            padding: 4px;
            border: 1px solid var(--border-indigo);
            gap: 4px;
        }

        .lang-opt {
            display: block;
            padding: 4px 8px;
            border-radius: 20px;
            transition: var(--transition-fast);
            opacity: 0.5;
        }

        .lang-opt .flag {
            display: block;
            border-radius: 2px;
        }

        .lang-toggle .lang-opt.active {
            opacity: 1;
            background: rgba(255, 215, 0, 0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition-fast);
            text-decoration: none;
            font-family: 'Cairo';
            border: none;
        }

        .btn.primary {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); }
            100% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        }

        .btn.primary:hover {
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        .btn.outline {
            background: transparent;
            border: 1px solid var(--border-glow);
            color: var(--text-light);
        }

        .btn.outline:hover {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .btn.lg {
            padding: 14px 32px;
            font-size: 16px;
        }

        .btn.whatsapp {
            background: #25D366;
            color: #fff;
        }

        .btn.whatsapp:hover {
            background: #1da851;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
        }

        .nav-cta-btn {
            padding: 8px 20px;
            font-size: 13px;
        }

        .mobile-toggle {
            display: none;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            flex-direction: column;
            gap: 5px;
        }

        .mobile-toggle span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text-light);
            border-radius: 2px;
            transition: var(--transition-fast);
        }

        .mobile-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .mobile-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            padding: 60px 0 80px;
            overflow: hidden;
            min-height: 80vh;
            display: flex;
            align-items: center;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .hero-bg-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-bg-mortar {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.3;
        }

        .hero-bg-grain {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 60%);
        }

        .hero-bg-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(3, 7, 18, 0.6) 100%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-copy {
            position: relative;
        }

        .hero-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            list-style: none;
            margin-bottom: 24px;
        }

        .hero-badges li {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--border-glow);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-title-accent {
            color: var(--accent-gold);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }

        .hero-lead {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .hero-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .hero-trust {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            list-style: none;
        }

        .hero-trust li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .hero-trust li svg {
            color: var(--accent-gold);
            flex-shrink: 0;
        }

        .hero-trust li b {
            color: var(--text-light);
            display: block;
            font-size: 14px;
        }

        .hero-trust li span {
            display: flex;
            flex-direction: column;
        }

        .hero-visual {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-grid-lines {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 215, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            opacity: 0.3;
        }

        .hero-plinth {
            position: absolute;
            width: 80%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-product {
            position: relative;
            max-width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.2));
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .hero-spec-card {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 16px 20px;
            min-width: 180px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .hero-spec-std {
            display: block;
            font-size: 12px;
            color: var(--accent-cyan);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hero-spec-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 4px 0;
        }

        .hero-spec-row .muted {
            color: var(--text-muted);
        }

        .hero-spec-code {
            display: block;
            margin-top: 8px;
            font-size: 11px;
            color: var(--accent-gold);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* ===== TRUST ===== */
        .trust {
            padding: 40px 0;
            border-top: 1px solid var(--border-glow);
            border-bottom: 1px solid var(--border-glow);
        }

        .trust-row {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            list-style: none;
            text-align: center;
        }

        .trust-row li {
            display: flex;
            flex-direction: column;
        }

        .trust-row b {
            font-size: 16px;
            color: var(--accent-gold);
        }

        .trust-row span {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ===== SECTIONS ===== */
        .section {
            padding: 60px 0;
            position: relative;
            z-index: 1;
        }

        .section--alt {
            background: rgba(3, 7, 18, 0.3);
            border-top: 1px solid var(--border-glow);
            border-bottom: 1px solid var(--border-glow);
        }

        .section-head {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 40px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            justify-content: center;
        }

        .eyebrow-mark {
            width: 20px;
            height: 2px;
            background: var(--accent-gold);
            border-radius: 2px;
        }

        .section-head h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 12px;
        }

        .section-sub {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ===== ABOUT ===== */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .about-copy h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 30px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 16px;
        }

        .about-copy p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .about-ticks {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .tick {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .tick-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-gold);
            min-width: 36px;
        }

        .tick strong {
            display: block;
            color: #fff;
        }

        .tick .muted {
            color: var(--text-muted);
            font-size: 14px;
        }

        .about-foot {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .about-foot-note {
            font-size: 13px;
        }

        .about-media {
            position: relative;
            border-radius: var(--radius-card);
            overflow: hidden;
            border: 1px solid var(--border-glow);
            box-shadow: var(--shadow-glow);
        }

        .about-media img {
            width: 100%;
            height: auto;
            display: block;
        }

        .about-media-tag {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            border: 1px solid var(--border-glow);
        }

        /* ===== SEGMENTS ===== */
        .segments {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .segment {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-card);
            padding: 24px 16px;
            text-align: center;
            transition: var(--transition-fast);
            cursor: default;
            box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.1), 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .segment:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
        }

        .seg-ico {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
            color: var(--accent-gold);
        }

        .segment b {
            display: block;
            font-size: 15px;
            color: #fff;
        }

        /* ===== FAMILIES ===== */
        .families {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .family {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-card);
            overflow: hidden;
            transition: var(--transition-fast);
        }

        .family:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }

        .family--feature {
            border-color: var(--accent-gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
        }

        .family--wide {
            grid-template-columns: 1fr;
        }

        .family--wide .family-media {
            max-height: 300px;
        }

        .family-media {
            position: relative;
            overflow: hidden;
            min-height: 250px;
        }

        .family-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .family-std {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
            border: 1px solid var(--border-glow);
        }

        .family-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .family-body h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .family-body p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .family-specs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
        }

        .family-specs li {
            background: rgba(3, 7, 18, 0.5);
            border: 1px solid var(--border-indigo);
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
        }

        .family-specs li span:first-child {
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .family-specs li span:last-child {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* ===== FEATURED ===== */
        .featured {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .feat-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-card);
            padding: 24px;
            transition: var(--transition-fast);
            box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.1), 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .feat-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
        }

        .feat-card--accent {
            border-color: var(--accent-cyan);
        }

        .feat-card--accent:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
        }

        .feat-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .feat-card h3 {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .feat-card p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .feat-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .feat-meta div {
            display: flex;
            flex-direction: column;
            font-size: 13px;
        }

        .feat-meta dt {
            color: var(--text-muted);
        }

        .feat-meta dd {
            font-weight: 700;
            color: #fff;
        }

        /* ===== BAND ===== */
        .band {
            position: relative;
            padding: 60px 0;
            overflow: hidden;
        }

        .band-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: 0;
        }

        .band-veil {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(3, 7, 18, 0.8), rgba(3, 7, 18, 0.4));
            z-index: 0;
        }

        .band-inner {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 700px;
        }

        .band-inner h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 12px;
        }

        .band-inner p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        /* ===== SERVICES ===== */
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .service {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-card);
            padding: 24px 16px;
            text-align: center;
            transition: var(--transition-fast);
            box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.1), 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .service:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
        }

        .svc-ico {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
            color: var(--accent-gold);
        }

        .service b {
            display: block;
            color: #fff;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .service .muted {
            font-size: 13px;
        }

        .services-cta {
            margin-top: 30px;
        }
    </style>
</head>
