<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KATANBUILD | لوحة المحاسب</title>
    <link rel="icon" type="image/png" href="https://katanbuild.com/storage/branding/logo-dark.png" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Cairo:wght@300;600;800;900&display=swap" rel="stylesheet" />
    <style>
        :root { --bg:#030712; --gold:#ffd700; --cyan:#38bdf8; --glass:rgba(15,23,42,0.6); --border:rgba(255,215,0,0.25); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Cairo',sans-serif; background:var(--bg); color:#f1f5f9; min-height:100vh; }
        .container { max-width:1200px; margin:0 auto; padding:20px; }
        .header { background:rgba(3,7,18,0.85); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:12px 0; }
        .header-inner { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        .logo img { height:48px; filter:drop-shadow(0 0 20px var(--gold)); }
        .nav { display:flex; gap:24px; flex-wrap:wrap; }
        .nav a { color:#f1f5f9; text-decoration:none; font-weight:700; transition:0.3s; }
        .nav a:hover { color:var(--gold); }
        .login-box { max-width:400px; margin:100px auto; background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:16px; padding:30px; text-align:center; }
        .login-box input { width:100%; padding:10px; border-radius:12px; border:1px solid var(--border); background:rgba(3,7,18,0.6); color:#fff; margin:10px 0; font-family:'Cairo'; }
        .login-box button { background:var(--gold); color:#000; border:none; padding:10px 24px; border-radius:12px; font-weight:700; cursor:pointer; }
        .stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin:20px 0; }
        .stat-card { background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:16px; padding:16px; text-align:center; }
        .stat-card .num { font-family:'Orbitron'; font-size:28px; font-weight:900; color:var(--gold); }
        .stat-card .label { color:#94a3b8; font-size:13px; }
        .filters { display:flex; gap:12px; flex-wrap:wrap; margin:16px 0; }
        .filters input, .filters select { padding:8px 12px; border-radius:12px; border:1px solid var(--border); background:rgba(3,7,18,0.6); color:#fff; flex:1; min-width:150px; }
        .filters button { background:var(--gold); color:#000; border:none; padding:8px 20px; border-radius:12px; font-weight:700; cursor:pointer; }
        .order-item { display:flex; flex-direction:column; gap:8px; background:rgba(3,7,18,0.5); border:1px solid var(--border); border-radius:12px; padding:16px; margin:8px 0; }
        .order-item .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        .order-item .badge { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700; }
        .badge-green { background:#22c55e; color:#000; }
        .badge-yellow { background:#eab308; color:#000; }
        .badge-orange { background:#f97316; color:#fff; }
        .order-item .actions { display:flex; gap:6px; flex-wrap:wrap; }
        .order-item .actions button { background:var(--gold); color:#000; border:none; padding:4px 12px; border-radius:6px; cursor:pointer; font-weight:700; }
        .order-item .actions button.danger { background:#ef4444; color:#fff; }
        .order-item .items-list { display:flex; flex-wrap:wrap; gap:6px; font-size:13px; color:#94a3b8; }
        .order-item .price-details { display:flex; gap:12px; flex-wrap:wrap; font-size:14px; }
        .order-item .price-details .original { text-decoration:line-through; color:#94a3b8; }
        .order-item .price-details .final { color:var(--gold); font-weight:700; }
        .order-item .price-details .syp { color:var(--cyan); font-size:13px; }
        .btn-wa { background:#25D366; color:#fff; padding:4px 12px; border-radius:6px; border:none; cursor:pointer; font-weight:700; }
        .btn-wa:hover { background:#1da851; }
        .hidden { display:none !important; }
        .footer { padding:20px 0; border-top:1px solid var(--border); text-align:center; color:#94a3b8; }
        .customer-price-section { margin:20px 0; background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:16px; padding:20px; }
        .customer-price-section input, .customer-price-section select { padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:rgba(3,7,18,0.6); color:#fff; margin:4px 0; width:100%; }
        .customer-price-section .row { display:flex; gap:10px; flex-wrap:wrap; }
        .customer-price-section .row > * { flex:1; min-width:120px; }
        .customer-price-section .discount-row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; align-items:center; }
        .customer-price-section .discount-row select, .customer-price-section .discount-row input { flex:1; min-width:100px; }
    </style>
</head>
<body>
    <div id="loginBox">
        <div class="login-box">
            <h2 style="font-family:'Orbitron';">🔐 لوحة المحاسب</h2>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" />
            <button onclick="login()">دخول</button>
            <div id="loginError" style="color:#ef4444;margin-top:10px;"></div>
        </div>
    </div>

    <div id="dashboardContent" class="hidden">
        <header class="header">
            <div class="container header-inner">
                <a class="logo" href="/"><img src="https://katanbuild.com/storage/branding/logo-dark.png" /></a>
                <nav class="nav"><a href="/">الرئيسية</a><a href="/orders.html">طلب</a></nav>
            </div>
        </header>
        <div class="container">
            <h1 style="font-family:'Orbitron'; margin:20px 0;">لوحة المحاسب</h1>

            <!-- ===== STATS ===== -->
            <div class="stats" id="stats">
                <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">إجمالي الطلبات</div></div>
                <div class="stat-card"><div class="num" id="statDebt">0</div><div class="label">الديون</div></div>
                <div class="stat-card"><div class="num" id="statPaid">0</div><div class="label">مدفوع مسبقاً</div></div>
                <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">غير مكتملة</div></div>
            </div>

            <!-- ===== FILTERS ===== -->
            <div class="filters">
                <input type="text" id="searchInput" placeholder="بحث بالاسم..." oninput="renderOrders()" />
                <select id="statusFilter" onchange="renderOrders()">
                    <option value="all">الكل</option>
                    <option value="complete">مكتملة</option>
                    <option value="paid">مدفوعة</option>
                    <option value="pending">غير مكتملة</option>
                </select>
                <button onclick="renderOrders()">تحديث</button>
            </div>

            <!-- ===== CUSTOMER PRICES (PRODUCT-BASED) ===== -->
            <div class="customer-price-section">
                <h3 style="color:var(--gold);">💲 أسعار وخصومات مخصصة للزبائن الدائمين (على مستوى المنتج)</h3>
                <div class="row">
                    <input type="text" id="custName" placeholder="اسم الزبون" />
                    <input type="text" id="custPhone" placeholder="رقم الهاتف" />
                    <input type="text" id="custAddress" placeholder="العنوان" />
                </div>
                <div class="discount-row">
                    <select id="custProduct"><option value="">اختر المنتج للخصم</option></select>
                    <input type="number" id="custDiscountPrice" placeholder="السعر المخصوم ($)" step="0.5" />
                    <button class="btn-gold" onclick="addProductDiscount()">➕ إضافة خصم منتج</button>
                </div>
                <div id="tempDiscounts" style="margin:8px 0; display:flex; flex-wrap:wrap; gap:6px;"></div>
                <button class="btn-gold" onclick="saveCustomer()">💾 حفظ الزبون الدائم</button>
                <div id="customerList" style="margin-top:10px;"></div>
            </div>

            <!-- ===== ORDERS ===== -->
            <div id="ordersList"></div>

            <!-- ===== PREPAYMENT ===== -->
            <div class="customer-price-section">
                <h3 style="color:var(--gold);">💰 دفع مسبق</h3>
                <div class="row">
                    <input type="text" id="prepayName" placeholder="اسم الزبون" />
                    <input type="number" id="prepayAmount" placeholder="المبلغ المدفوع ($)" />
                    <button class="btn-gold" onclick="addPrepayment()">تسجيل</button>
                </div>
                <div id="prepayList" style="margin-top:10px;"></div>
            </div>

            <!-- ===== PRICE MANAGEMENT ===== -->
            <div class="price-section">
                <h3 style="color:var(--gold);">💰 إدارة أسعار المنتجات الافتراضية</h3>
                <table id="priceTable"><thead><tr><th>المنتج</th><th>السعر ($)</th><th>تعديل</th></tr></thead><tbody id="priceTableBody"></tbody></table>
            </div>
        </div>
        <footer class="footer">© 2026 مؤسسة قطان التجارية</footer>
    </div>

    <script>
        // ===== LOGIN =====
        function login() {
            const pwd = document.getElementById('passwordInput').value;
            if (pwd === '1992') {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboardContent').classList.remove('hidden');
                loadAll();
            } else {
                document.getElementById('loginError').textContent = '❌ كلمة مرور خاطئة';
            }
        }

        function loadAll() { renderOrders(); renderPrices(); renderCustomers(); renderPrepayments(); populateProductSelect(); }

        // ===== PRICES (Product Defaults) =====
        function renderPrices() {
            const prices = JSON.parse(localStorage.getItem('katan_prices') || '{}');
            const allProducts = ['كارو فيكس','كلايتور','بروسيل احمر','القرع ديكور فيكس','لازورد','فورريفر فيكس','ايفرست','آن ازرق','الباسل','عباس','اونكس','الترا غريب اكسترا','اكوا فيكس بلس','بروسيل مسابح','الترا بوند ازرق','ليث ازرق','الترا جريب','كلوبال فيكس','توب فيكس','ناولو','سلامات فكس','سبان فيكس','شربجي','نجار فيكس','الترا بوند اخضر','بروسيل اخضر','سيتي فيكس','كرافت الترافيكس','لايت فيكس','بريمير فيكس','موسيك فيكس','سيرا فيكس','منستر فيكس 100','فيكسو','الترا بوند احمر','بروسيل رمادي','مارفيل','الترا بوند ذهبي','الترا بوند اورنج','طينة سولايد ميكس اسمنتية 50كغ','طينة اسمنتية سولايد ميكس 18كغ','الترا بوند طينة بلاستيكية','الترا بوند طينة اكرليكية','طينة غرانيت','الترا جريب','جراوت اصلاح الترا بوند','عازل مركبين','عازل بلاستيكي','عازل حجر شفاف'];
            const tbody = document.getElementById('priceTableBody');
            tbody.innerHTML = allProducts.map(p => `
                <tr><td>${p}</td><td><input type="number" id="price_${p}" value="${prices[p] || 10}" step="0.5" /></td>
                <td><button onclick="updatePrice('${p}')">حفظ</button></td></tr>
            `).join('');
        }
        function updatePrice(product) {
            const val = document.getElementById(`price_${product}`).value;
            const prices = JSON.parse(localStorage.getItem('katan_prices') || '{}');
            prices[product] = parseFloat(val);
            localStorage.setItem('katan_prices', JSON.stringify(prices));
            alert('✅ تم حفظ السعر');
            renderPrices();
        }

        // ===== CUSTOMERS (Product-based discounts) =====
        let tempCustomerDiscounts = {};
        function getCustomers() { return JSON.parse(localStorage.getItem('katan_customers') || '[]'); }
        function populateProductSelect() {
            const sel = document.getElementById('custProduct');
            const allProducts = ['كارو فيكس','كلايتور','بروسيل احمر','القرع ديكور فيكس','لازورد','فورريفر فيكس','ايفرست','آن ازرق','الباسل','عباس','اونكس','الترا غريب اكسترا','اكوا فيكس بلس','بروسيل مسابح','الترا بوند ازرق','ليث ازرق','الترا جريب','كلوبال فيكس','توب فيكس','ناولو','سلامات فكس','سبان فيكس','شربجي','نجار فيكس','الترا بوند اخضر','بروسيل اخضر','سيتي فيكس','كرافت الترافيكس','لايت فيكس','بريمير فيكس','موسيك فيكس','سيرا فيكس','منستر فيكس 100','فيكسو','الترا بوند احمر','بروسيل رمادي','مارفيل','الترا بوند ذهبي','الترا بوند اورنج','طينة سولايد ميكس اسمنتية 50كغ','طينة اسمنتية سولايد ميكس 18كغ','الترا بوند طينة بلاستيكية','الترا بوند طينة اكرليكية','طينة غرانيت','الترا جريب','جراوت اصلاح الترا بوند','عازل مركبين','عازل بلاستيكي','عازل حجر شفاف'];
            sel.innerHTML = '<option value="">اختر المنتج للخصم</option>' + allProducts.map(p => `<option value="${p}">${p}</option>`).join('');
        }
        function addProductDiscount() {
            const product = document.getElementById('custProduct').value;
            const price = parseFloat(document.getElementById('custDiscountPrice').value);
            if (!product || isNaN(price)) return alert('اختر منتج وأدخل سعراً مخصوماً');
            tempCustomerDiscounts[product] = price;
            renderTempDiscounts();
            document.getElementById('custProduct').value = '';
            document.getElementById('custDiscountPrice').value = '';
        }
        function removeTempDiscount(product) {
            delete tempCustomerDiscounts[product];
            renderTempDiscounts();
        }
        function renderTempDiscounts() {
            const container = document.getElementById('tempDiscounts');
            container.innerHTML = Object.keys(tempCustomerDiscounts).map(p =>
                `<span style="background:rgba(3,7,18,0.5);border:1px solid var(--border);padding:4px 10px;border-radius:6px;">${p}: $${tempCustomerDiscounts[p]} <button onclick="removeTempDiscount('${p}')" style="background:#ef4444;border:none;color:#fff;border-radius:4px;padding:0 6px;cursor:pointer;">✕</button></span>`
            ).join('');
        }
        function saveCustomer() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            if (!name || !phone) return alert('أدخل اسم الزبون ورقم الهاتف');
            if (Object.keys(tempCustomerDiscounts).length === 0) return alert('أضف خصماً لمنتج واحد على الأقل');
            let list = getCustomers();
            const existing = list.find(c => c.name === name && c.phone === phone);
            if (existing) {
                existing.address = address;
                existing.productDiscounts = { ...tempCustomerDiscounts };
            } else {
                list.push({ name, phone, address, productDiscounts: { ...tempCustomerDiscounts } });
            }
            localStorage.setItem('katan_customers', JSON.stringify(list));
            tempCustomerDiscounts = {};
            renderTempDiscounts();
            renderCustomers();
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('custAddress').value = '';
            alert('✅ تم حفظ الزبون الدائم وخصوماته');
        }
        function renderCustomers() {
            const list = getCustomers();
            const container = document.getElementById('customerList');
            container.innerHTML = list.map((c, i) => `
                <div style="display:flex;justify-content:space-between;padding:8px 12px;background:rgba(3,7,18,0.5);border-radius:8px;margin:4px 0;flex-wrap:wrap;gap:8px;">
                    <div><strong>${c.name}</strong> - ${c.phone} - ${c.address || ''}<br><span style="font-size:12px;color:var(--cyan);">خصومات: ${Object.keys(c.productDiscounts).map(p=>`${p} ($${c.productDiscounts[p]})`).join(', ')}</span></div>
                    <button onclick="deleteCustomer(${i})" style="background:#ef4444;border:none;color:#fff;padding:2px 12px;border-radius:6px;cursor:pointer;">✕</button>
                </div>
            `).join('');
        }
        function deleteCustomer(index) {
            let list = getCustomers();
            list.splice(index, 1);
            localStorage.setItem('katan_customers', JSON.stringify(list));
            renderCustomers();
        }

        // ===== ORDERS (With Product-based discount application) =====
        function getOrders() { return JSON.parse(localStorage.getItem('katan_orders') || '[]'); }
        function renderOrders() {
            let orders = getOrders();
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('statusFilter').value;
            if (search) orders = orders.filter(o => o.name.toLowerCase().includes(search));
            if (filter !== 'all') orders = orders.filter(o => o.status === filter);

            const customers = getCustomers();
            const exchange = 13000;

            document.getElementById('statTotal').textContent = orders.length;
            const debt = orders.filter(o=>o.status==='pending').reduce((s,i)=>s+(i.total-i.paid||0),0);
            document.getElementById('statDebt').textContent = `$${debt.toFixed(2)}`;
            document.getElementById('statPaid').textContent = `$${orders.filter(o=>o.status==='paid').reduce((s,i)=>s+i.total,0).toFixed(2)}`;
            document.getElementById('statPending').textContent = orders.filter(o=>o.status==='pending').length;

            const list = document.getElementById('ordersList');
            if (!orders.length) { list.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">لا توجد طلبات</div>'; return; }

            list.innerHTML = orders.map(o => {
                // Check if customer exists
                const customer = customers.find(c => c.name === o.name && c.phone === o.phone);
                
                // Calculate original total and discounted total
                let originalTotal = 0;
                let finalTotal = 0;
                let discountApplied = false;
                const itemDetails = o.items.map(item => {
                    const price = item.price || 10; // fallback
                    originalTotal += item.qty * price;
                    let finalPrice = price;
                    // Apply product-specific discount
                    if (customer && customer.productDiscounts && customer.productDiscounts[item.name]) {
                        finalPrice = customer.productDiscounts[item.name];
                        discountApplied = true;
                    }
                    finalTotal += item.qty * finalPrice;
                    return { ...item, originalPrice: price, finalPrice };
                }).map(item => 
                    `${item.name} (${item.qty}×)${customer && customer.productDiscounts[item.name] ? ` <span style="color:var(--cyan);">($${item.originalPrice} → $${item.finalPrice})</span>` : ''}`
                ).join(' • ');

                const finalTotalSYP = (finalTotal * exchange).toFixed(0);
                const originalTotalSYP = (originalTotal * exchange).toFixed(0);

                return `
                    <div class="order-item">
                        <div class="top">
                            <div>
                                <strong>${o.name}</strong> 
                                <span style="color:#94a3b8;font-size:13px;">${o.phone}</span>
                                ${o.address ? `<span style="color:#94a3b8;font-size:13px;">📍 ${o.address}</span>` : ''}
                                <span style="color:#94a3b8;font-size:13px;">${o.date}</span>
                                <span class="badge ${o.status==='complete'?'badge-green':o.status==='paid'?'badge-yellow':'badge-orange'}">${o.status==='complete'?'مكتملة':o.status==='paid'?'مدفوعة':'غير مكتملة'}</span>
                                ${customer ? `<span style="background:var(--gold);color:#000;padding:2px 8px;border-radius:4px;font-weight:700;font-size:12px;">⭐ زبون دائم</span>` : ''}
                            </div>
                            <div class="actions">
                                ${o.status === 'pending' ? `<button onclick="markPaid('${o.id}')">✅ دفع</button>` : ''}
                                <button onclick="sendWACustomer('${o.id}')" class="btn-wa">📩 إرسال تأكيد واتساب</button>
                                <button class="danger" onclick="deleteOrder('${o.id}')">🗑️</button>
                            </div>
                        </div>
                        <div class="items-list">📦 ${itemDetails}</div>
                        <div class="price-details">
                            ${discountApplied ? `<span class="original">$${originalTotal.toFixed(2)} (≈ ${originalTotalSYP} SYP)</span>` : ''}
                            <span class="final">$${finalTotal.toFixed(2)}</span>
                            <span class="syp">≈ ${finalTotalSYP} SYP</span>
                            ${o.status === 'pending' && o.paid ? `<span style="color:#f97316;">المتبقي: $${(o.total - o.paid).toFixed(2)}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== ACTIONS =====
        function markPaid(id) {
            let orders = getOrders();
            const i = orders.findIndex(o => o.id == id);
            if (i===-1) return;
            orders[i].status = 'paid'; orders[i].paid = orders[i].total;
            localStorage.setItem('katan_orders', JSON.stringify(orders));
            renderOrders();
        }
        function deleteOrder(id) {
            if (!confirm('حذف الطلب نهائياً؟')) return;
            let orders = getOrders().filter(o => o.id != id);
            localStorage.setItem('katan_orders', JSON.stringify(orders));
            renderOrders();
        }
        function sendWACustomer(id) {
            const orders = getOrders();
            const o = orders.find(i => i.id == id);
            if (!o) return alert('الطلب غير موجود');
            const customer = getCustomers().find(c => c.name === o.name && c.phone === o.phone);
            let finalTotal = 0;
            const details = o.items.map(item => {
                let price = item.price || 10;
                if (customer && customer.productDiscounts && customer.productDiscounts[item.name]) {
                    price = customer.productDiscounts[item.name];
                }
                finalTotal += item.qty * price;
                return `- ${item.name} (${item.qty} × $${price})`;
            }).join('\n');
            const exchange = 13000;
            const totalSYP = (finalTotal * exchange).toFixed(0);
            const msg = `السلام عليكم السيد ${o.name}، لقد تلقينا طلبكم بالمواد التالية:\n${details}\nالمبلغ الكامل: $${finalTotal.toFixed(2)} (≈ ${totalSYP} SYP)\nسيتم تجهيز طلبكم خلال ساعات، تفضل بزيارتنا لاستكمال الإجراءات.`;
            window.open(`https://wa.me/${o.phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // ===== PREPAYMENTS =====
        function getPrepayments() { return JSON.parse(localStorage.getItem('katan_prepayments') || '[]'); }
        function addPrepayment() {
            const name = document.getElementById('prepayName').value.trim();
            const amount = parseFloat(document.getElementById('prepayAmount').value);
            if (!name || isNaN(amount)) return alert('أدخل الاسم والمبلغ');
            let list = getPrepayments();
            list.push({ name, amount, date: new Date().toLocaleString('ar-SY') });
            localStorage.setItem('katan_prepayments', JSON.stringify(list));
            renderPrepayments();
            document.getElementById('prepayName').value = '';
            document.getElementById('prepayAmount').value = '';
        }
        function renderPrepayments() {
            const list = getPrepayments();
            const container = document.getElementById('prepayList');
            container.innerHTML = list.map((p, i) => `
                <div style="display:flex;justify-content:space-between;padding:6px 12px;background:rgba(3,7,18,0.5);border-radius:8px;margin:4px 0;">
                    <span>${p.name} - $${p.amount} (${p.date})</span>
                    <button onclick="deletePrepayment(${i})" style="background:#ef4444;border:none;color:#fff;padding:2px 12px;border-radius:6px;cursor:pointer;">✕</button>
                </div>
            `).join('');
        }
        function deletePrepayment(index) {
            let list = getPrepayments();
            list.splice(index, 1);
            localStorage.setItem('katan_prepayments', JSON.stringify(list));
            renderPrepayments();
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            renderOrders();
            renderPrices();
            renderCustomers();
            renderPrepayments();
            populateProductSelect();
        });
    </script>
</body>
</html>
